services:
  frontend:
    image: ghcr.io/commitlens/twin-ai-fe:dev
    ports:
      - "3000:3000"
    environment:
      # Must be reachable from the browser, not just from inside this
      # container's network — a Docker service name like http://backend:8000
      # will not resolve for the browser.
      # Defaults to localhost for local dev; override by setting API_URL
      # before running compose (e.g. `API_URL=https://commitlens.tech/v1 docker compose up -d`)
      # or via a .env file in this directory.
      NEXT_PUBLIC_API_URL: https://commitlens.tech/v1  
